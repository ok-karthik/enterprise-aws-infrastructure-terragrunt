apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: iac-generation-agent
  description: Autonomous IaC Platform Agent for scaffolding and reconciling compliant AWS Terragrunt infrastructure.
  tags:
    - aws
    - terragrunt
    - terraform
    - iac
    - platform-engineering
    - automation
  annotations:
    github.com/project-slug: ok-karthik/enterprise-aws-infrastructure-terragrunt
spec:
  type: service
  lifecycle: production
  owner: platform-team
  providesApis:
    - iac-platform-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: iac-platform-api
  description: Platform Engineering API for on-demand infrastructure generation, drift reconciliation, and catalog scaffolding.
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  definition: |
    openapi: 3.0.0
    info:
      title: IaC Platform Agent API
      version: 1.0.0
    paths:
      /v1/generate:
        post:
          summary: Generate a compliant Terragrunt module
      /v1/reconcile:
        post:
          summary: Reconcile detected infrastructure drift into HCL
      /v1/catalog:
        get:
          summary: List available golden-path templates
