# Golden-path module catalog for the IaC Generation Agent (.agents/scripts/iac_agent.py).
#
# Entries with a `template` are fully pre-vetted: iac_agent.py renders them deterministically
# (no LLM call needed to author the HCL) and only falls back to LLM-generated diffs if the
# rendered template fails validation. Entries without a `template` are classification hints
# only — they still route the request to a fixed module_path/resource_hint, but the actual
# HCL is generated by the LLM the same way an uncatalogued request is.
#
# Add entries here as new golden paths get vetted — see PLAN.md Phase D1.

- id: data/s3-encrypted
  description: >-
    Encrypted, versioned, private S3 bucket. Reuses the vetted
    terraform-aws-modules/s3-bucket/aws registry module — same pattern as the existing
    infrastructure-live/_envcommon/data/s3.hcl — rather than a hand-rolled resource block.
  module_path: data/s3-encrypted
  resource_hint: aws_s3_bucket
  keywords:
    - s3
    - bucket
    - object storage
    - artifact
    - artifacts
    - build artifact
  template: data-s3-encrypted

- id: data/rds-postgres
  description: >-
    RDS PostgreSQL instance with encryption at rest, KMS, automated backups, and non-public networking.
    Pre-vetted golden path reusing terraform-aws-modules/rds/aws.
  module_path: data/rds-postgres
  resource_hint: aws_db_instance
  keywords:
    - rds
    - postgres
    - postgresql
    - database
    - db instance
  template: data-rds-postgres

- id: data/dynamodb-table
  description: >-
    DynamoDB table with point-in-time recovery, encryption at rest, and PAY_PER_REQUEST billing.
    Pre-vetted golden path reusing terraform-aws-modules/dynamodb-table/aws.
  module_path: data/dynamodb-table
  resource_hint: aws_dynamodb_table
  keywords:
    - dynamodb
    - dynamo db
    - nosql table
  template: data-dynamodb-table
